    <!-- Fuentes del sistema - Sin dependencias externas -->
    
    <!-- Iconos SVG locales -->
    <link rel="stylesheet" href="svg/icons.css">
    
    <!-- Styles -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Loading indicator -->
    <div id="loading-indicator" class="loading-indicator">
        <div class="spinner"></div>
        <p>Cargando...</p>
    </div>

    <!-- Main content -->
    <div id="main-content" class="app-container">
        <!-- Header Section - Se carga dinámicamente -->
        <div id="header-container"></div>

        <!-- Navigation - Se carga dinámicamente -->
        <div id="navigation-container"></div>

        <!-- Main Content -->
        <main class="main-content">
            <!-- About Section - Se carga dinámicamente -->
            <div id="about-container"></div>

            <!-- Experience Section - Se carga dinámicamente -->

            <!-- Education Section - Se carga dinámicamente -->

            <!-- Skills Section - Se carga dinámicamente -->
            <div id="skills-container"></div>

            <!-- Contact Section - Se carga dinámicamente -->
            <div id="contact-container"></div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="script.js"></script>
    
    <!-- Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then((registration) => {
                        console.log('SW registrado:', registration);
                    })
                    .catch((error) => {
                        console.log('Error SW:', error);
                    });
            });
        }
    </script>
