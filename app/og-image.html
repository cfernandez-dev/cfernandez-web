<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>OG Image Generator</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 1200px;
            height: 630px;
            background: linear-gradient(135deg, #2563eb 0%, #0ea5e9 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: white;
        }
        .content {
            text-align: center;
            padding: 60px;
        }
        .name {
            font-size: 4rem;
            font-weight: 700;
            margin-bottom: 20px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }
        .title {
            font-size: 1.8rem;
            font-weight: 400;
            margin-bottom: 30px;
            opacity: 0.9;
        }
        .subtitle {
            font-size: 1.2rem;
            opacity: 0.8;
            margin-bottom: 40px;
        }
        .badges {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        .badge {
            background: rgba(255, 255, 255, 0.2);
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="content">
        <div class="name">Cristhian Fernández</div>
        <div class="title">AI / ML Engineer</div>
        <div class="subtitle">Especialista en Inteligencia Artificial y Ciencia de Datos</div>
        <div class="badges">
            <div class="badge">Machine Learning</div>
            <div class="badge">Computer Vision</div>
            <div class="badge">AWS Cloud</div>
            <div class="badge">Python</div>
        </div>
    </div>
</body>
</html>
